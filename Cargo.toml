[package]
name = "ski"
version = "0.1.0"
edition = "2024"

[dependencies]
dirs = "7.0.0"
eframe = "0.37.0"
flate2 = "1.1.10"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
libc = "0.2"
open = "5.4.4"
resvg = { version = "0.45", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tar = "0.4.46"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
hayro = "0.8.0"
zbus = "5"
blocking = "1"

[profile.dev.package."*"]
opt-level = 3
