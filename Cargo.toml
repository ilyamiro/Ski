[package]
name = "ski"
version = "0.1.0"
edition = "2024"

[dependencies]
dirs = "7.0.0"
eframe = "0.37.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
open = "5.4.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[profile.dev.package."*"]
opt-level = 3
