[package]
name = "ski"
version = "0.1.1"
edition = "2024"
description = "A small, fast, keyboard-friendly file manager"
license = "MIT"
repository = "https://github.com/ilyamiro/Ski"

[dependencies]
dirs = "7.0.0"
eframe = { version = "0.37.0", features = ["glow"] }
base64 = "0.22"
flate2 = "1.1.10"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico", "tiff", "tga", "pnm", "qoi", "hdr", "dds"] }
libc = "0.2"
open = "5.4.4"
resvg = { version = "0.45", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tar = "0.4.46"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
hayro = "0.8.0"
arboard = "3.7"
wl-clipboard-rs = "0.9"
zbus = "5"
blocking = "1"
wayland-protocols = { version = "0.32", features = ["client", "unstable"] }
wayland-client = "0.31"
raw-window-handle = "0.6"
x11-dl = "2.21"
ab_glyph = "0.2"
wayland-backend = { version = "0.3", features = ["client_system"] }
jpeg-decoder = { version = "0.3", default-features = false }
png = "0.18"
md5 = "0.7"
percent-encoding = "2"

# Thin LTO and 16 codegen units compile much faster than fat LTO in one unit, at about the same run-time speed
[profile.release]
lto = "thin"
codegen-units = 16

[profile.dev.package."*"]
opt-level = 3

# .deb and .rpm are built by .github/workflows/release.yml after packaging/stage.sh has laid out target/stage.
# The graphics libraries are loaded at run time, so the dependency lists are written out by hand.
[package.metadata.deb]
maintainer = "ilyamiro"
copyright = "ilyamiro"
license-file = ["LICENSE", "0"]
section = "utils"
priority = "optional"
extended-description = "A small, fast, keyboard-friendly file manager, which can also serve as the system's file chooser dialog."
depends = "libc6, libwayland-client0, libxkbcommon0, libxkbcommon-x11-0, libx11-6, libxcursor1, libxi6, libxrandr2, libgl1, libegl1, xdg-utils"
recommends = "ffmpeg, p7zip-full, shared-mime-info"
assets = [
    ["target/stage/usr/bin/ski", "usr/bin/", "755"],
    ["target/stage/usr/share/applications/ski.desktop", "usr/share/applications/", "644"],
    ["target/stage/usr/share/icons/hicolor/scalable/apps/ski.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["target/stage/usr/share/xdg-desktop-portal/portals/ski.portal", "usr/share/xdg-desktop-portal/portals/", "644"],
    ["target/stage/usr/share/dbus-1/services/org.freedesktop.impl.portal.desktop.ski.service", "usr/share/dbus-1/services/", "644"],
    ["target/stage/usr/share/dbus-1/services/org.freedesktop.FileManager1.service", "usr/share/dbus-1/services/", "644"],
]

[package.metadata.generate-rpm]
summary = "A small, fast, keyboard-friendly file manager"
url = "https://github.com/ilyamiro/Ski"
assets = [
    { source = "target/stage/usr/bin/ski", dest = "/usr/bin/ski", mode = "755" },
    { source = "target/stage/usr/share/applications/ski.desktop", dest = "/usr/share/applications/ski.desktop", mode = "644" },
    { source = "target/stage/usr/share/icons/hicolor/scalable/apps/ski.svg", dest = "/usr/share/icons/hicolor/scalable/apps/ski.svg", mode = "644" },
    { source = "target/stage/usr/share/xdg-desktop-portal/portals/ski.portal", dest = "/usr/share/xdg-desktop-portal/portals/ski.portal", mode = "644" },
    { source = "target/stage/usr/share/dbus-1/services/org.freedesktop.impl.portal.desktop.ski.service", dest = "/usr/share/dbus-1/services/org.freedesktop.impl.portal.desktop.ski.service", mode = "644" },
    { source = "target/stage/usr/share/dbus-1/services/org.freedesktop.FileManager1.service", dest = "/usr/share/dbus-1/services/org.freedesktop.FileManager1.service", mode = "644" },
    { source = "target/stage/usr/share/licenses/ski/LICENSE", dest = "/usr/share/licenses/ski/LICENSE", mode = "644", doc = false },
]

[package.metadata.generate-rpm.requires]
libwayland-client = "*"
libxkbcommon = "*"
libxkbcommon-x11 = "*"
libX11 = "*"
libXcursor = "*"
libXi = "*"
libXrandr = "*"
mesa-libGL = "*"
mesa-libEGL = "*"
xdg-utils = "*"
